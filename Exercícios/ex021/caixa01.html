<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1{ /*Box-level*/
            background-color: burlywood;
            height: 150px;
            width: 150px;
            /* BORDER = SHORTHAND - ORDER
            border-width: 10px;
            border-style: solid;
            border-color: brown;
            */

            border: 10px solid green; /*<-- width - style - color*/

            /* PADDING SHORTHAND
            padding-left: 10px;
            padding-bottom: 10px;
            padding-right: 10px;
            padding-top: 10px;
            */


            padding: 10px; /*CIMA DIREITA BAIXO ESQUERDA*/
            /*Quando todas são iguais pode colocar só um valor*/
            /*Quando usa 2 valores (10px 20px)
            O de cima e de baixo ficam iguais (10px)
            O da direita e esquerda ficam iguais (20px)*/

            /* MARGIN - SHORTHAND
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;
            */
            margin: 20px auto 40px auto;
            
            /* OUTLINE - SHORTHAND
            outline-width: 5px;
            outline-style: dashed;
            outline-color: black;
            */
            outline: 5px dashed blue;
        }
        
        a{ /*Inline level*/
            border: 5px solid pink;
            display: block;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona</p>
</body>
</html>
